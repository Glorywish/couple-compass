kind = "mobile"
previewPath = "/mobile/"
title = "Couple Compass Mobile"
version = "1.0.0"
id = "artifacts/couple-compass-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 22861

[services.development]
run = "pnpm --filter @workspace/couple-compass-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/couple-compass-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/couple-compass-mobile", "run", "serve" ]

[services.env]
PORT = "22861"
BASE_PATH = "/mobile/"
